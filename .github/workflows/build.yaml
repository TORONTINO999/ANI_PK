name: 🤖 Auto-Healing Android Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache Android SDK
      uses: actions/cache@v4
      with:
        path: ~/.android
        key: android-sdk-${{ runner.os }}
        restore-keys: |
          android-sdk-${{ runner.os }}

    - name: Cache Buildozer
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-${{ runner.os }}-

    - name: Create buildozer.spec
      run: |
        cat > buildozer.spec << 'EOF'
        [app]
        title = Anime Parser Pro
        package.name = animeparserpro
        package.domain = org.animeparser
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas,ttf,json,md
        version = 1.0.0
        requirements = python3==3.11.12,kivy==2.2.1,kivymd==1.1.1,pillow,requests,beautifulsoup4,html5lib,urllib3,charset-normalizer,idna,certifi
        orientation = portrait
        fullscreen = 0
        android.permissions = INTERNET,WRITE_EXTERNAL_STORAGE,READ_EXTERNAL_STORAGE,ACCESS_NETWORK_STATE
        android.api = 33
        android.minapi = 21
        android.ndk = 25.2.9519653
        android.ndk_api = 21
        android.archs = arm64-v8a
        android.allow_backup = True
        android.build_tools = 33.0.2
        
        [buildozer]
        log_level = 2
        warn_on_root = 1
        EOF

    - name: 🔨 Build APK with Docker
      run: |
        docker run --rm \
          -v $PWD:/app \
          -v ~/.buildozer:/home/user/.buildozer \
          -v ~/.android:/home/user/.android \
          -w /app \
          kivy/buildozer:latest \
          bash -c "
            export ANDROID_HOME=/home/user/.android/sdk
            export ANDROID_SDK_ROOT=/home/user/.android/sdk
            export PATH=\$ANDROID_HOME/cmdline-tools/latest/bin:\$ANDROID_HOME/tools/bin:\$ANDROID_HOME/platform-tools:\$PATH
            yes | buildozer android debug
          "

    - name: 📤 Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: anime-parser-apk
        path: bin/*.apk
        retention-days: 30

    - name: 📧 Notify build result
      if: always()
      run: |
        if [[ "${{ job.status }}" == "success" ]]; then
          echo "✅ Build succeeded! APK uploaded to artifacts."
        else
          echo "❌ Build failed!"
          echo "🔗 Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        fi
