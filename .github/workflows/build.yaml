name: 🤖 Auto-Healing Android Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Setup Java 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          git zip unzip autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev \
          cmake libffi-dev libssl-dev \
          automake libltdl-dev python3-dev \
          libtinfo6

    - name: Install Python packages
      run: |
        python -m pip install --upgrade pip
        pip install buildozer

    # =====================================================
    # 1️⃣ ПРЕДВАРИТЕЛЬНАЯ ЗАГРУЗКА ВСЕХ ЗАВИСИМОСТЕЙ
    # =====================================================
    - name: 📦 Pre-download all dependencies with mirrors
      run: |
        mkdir -p ~/.buildozer/android/platform/build-arm64-v8a/packages
        
        # Список зависимостей с зеркалами
        declare -A DEPS=(
          ["freetype"]="https://download.savannah.gnu.org/releases/freetype/freetype-2.14.1.tar.gz|https://github.com/akheron/jansson/raw/master/CMake/FindFreetype.cmake|https://mirrors.kernel.org/gnu/freetype/freetype-2.14.1.tar.gz"
          ["openssl"]="https://www.openssl.org/source/openssl-3.0.13.tar.gz|https://github.com/openssl/openssl/archive/refs/tags/openssl-3.0.13.tar.gz"
          ["jpeg"]="https://www.ijg.org/files/jpegsrc.v9f.tar.gz|https://github.com/winlibs/jpeg/archive/refs/tags/v9f.tar.gz"
          ["png"]="https://download.sourceforge.net/libpng/libpng-1.6.40.tar.gz|https://github.com/glennrp/libpng/archive/refs/tags/v1.6.40.tar.gz"
          ["sdl2"]="https://www.libsdl.org/release/SDL2-2.28.5.tar.gz|https://github.com/libsdl-org/SDL/archive/refs/tags/release-2.28.5.tar.gz"
          ["sdl2_image"]="https://www.libsdl.org/projects/SDL_image/release/SDL2_image-2.6.3.tar.gz|https://github.com/libsdl-org/SDL_image/archive/refs/tags/release-2.6.3.tar.gz"
          ["sdl2_mixer"]="https://www.libsdl.org/projects/SDL_mixer/release/SDL2_mixer-2.6.3.tar.gz|https://github.com/libsdl-org/SDL_mixer/archive/refs/tags/release-2.6.3.tar.gz"
          ["sdl2_ttf"]="https://www.libsdl.org/projects/SDL_ttf/release/SDL2_ttf-2.20.2.tar.gz|https://github.com/libsdl-org/SDL_ttf/archive/refs/tags/release-2.20.2.tar.gz"
        )
        
        for dep in "${!DEPS[@]}"; do
          echo "📦 Pre-downloading $dep..."
          IFS='|' read -ra URLS <<< "${DEPS[$dep]}"
          
          DOWNLOADED=false
          for url in "${URLS[@]}"; do
            filename=$(basename "$url")
            echo "  Trying: $url"
            if wget -q --timeout=30 --tries=3 "$url" -O "~/.buildozer/android/platform/build-arm64-v8a/packages/$dep/$filename" 2>/dev/null; then
              echo "  ✅ Downloaded from $url"
              DOWNLOADED=true
              break
            else
              echo "  ⚠️ Failed from $url, trying next mirror..."
            fi
          done
          
          if [ "$DOWNLOADED" = false ]; then
            echo "  ⚠️ All mirrors failed for $dep, will retry during build"
          fi
        done

    # =====================================================
    # 2️⃣ НАСТРОЙКА SDK
    # =====================================================
    - name: 🚀 Setup Android SDK
      uses: amyu/setup-android@v5
      with:
        sdk-version: 33
        build-tools-version: 33.0.2
        ndk-version: 25.2.9519653

    - name: Cache Buildozer
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    # =====================================================
    # 3️⃣ КОПИРУЕМ SDK
    # =====================================================
    - name: 🔧 Configure SDK for Buildozer
      run: |
        export AMYU_SDK=$HOME/.android/sdk
        export BUILD_OZER_SDK=$HOME/.buildozer/android/platform/android-sdk
        
        echo "🔄 Copying SDK from amyu to Buildozer location..."
        mkdir -p $BUILD_OZER_SDK
        cp -r $AMYU_SDK/* $BUILD_OZER_SDK/
        
        echo "✅ SDK copied to: $BUILD_OZER_SDK"
        
        # Создаем структуру, которую ожидает Buildozer
        echo "🔧 Creating legacy tools structure for Buildozer..."
        mkdir -p $BUILD_OZER_SDK/tools/bin
        
        # Создаем символические ссылки на sdkmanager и другие инструменты
        ln -sf $BUILD_OZER_SDK/cmdline-tools/latest/bin/sdkmanager $BUILD_OZER_SDK/tools/bin/sdkmanager
        ln -sf $BUILD_OZER_SDK/cmdline-tools/latest/bin/avdmanager $BUILD_OZER_SDK/tools/bin/avdmanager
        
        echo "✅ Legacy tools links created"
        
        # Проверяем platform-tools
        if [[ -d "$BUILD_OZER_SDK/platform-tools" ]]; then
          echo "✅ platform-tools found!"
        else
          echo "❌ platform-tools not found!"
          exit 1
        fi
        
        # Создаем файл с принятыми лицензиями
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        
        # Устанавливаем переменные окружения
        echo "ANDROID_HOME=$BUILD_OZER_SDK" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$BUILD_OZER_SDK" >> $GITHUB_ENV

    # =====================================================
    # 4️⃣ ПРИНИМАЕМ ЛИЦЕНЗИИ
    # =====================================================
    - name: Accept Android licenses
      run: |
        export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        echo "📝 Accepting Android SDK licenses..."
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        echo "✅ Licenses accepted"

    # =====================================================
    # 5️⃣ ДИАГНОСТИКА SDK
    # =====================================================
    - name: 🔍 SDK Diagnostics
      run: |
        export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        
        echo "========================================="
        echo "📱 SDK DIAGNOSTICS"
        echo "========================================="
        echo "ANDROID_HOME: $ANDROID_HOME"
        echo ""
        
        echo "📂 SDK Structure:"
        ls -la $ANDROID_HOME
        echo ""
        
        echo "🔍 Checking tools/bin:"
        ls -la $ANDROID_HOME/tools/bin/ 2>/dev/null || echo "  ❌ tools/bin not found!"
        echo ""
        
        echo "📦 Checking components:"
        for comp in "platform-tools" "build-tools/33.0.2" "platforms/android-33"; do
          if [[ -d "$ANDROID_HOME/$comp" ]]; then
            echo "  ✅ $comp"
          else
            echo "  ❌ $comp NOT found"
          fi
        done
        echo "========================================="

    # =====================================================
    # 6️⃣ СБОРКА APK С ПОВТОРНЫМИ ПОПЫТКАМИ
    # =====================================================
    - name: 🔨 Build APK
      run: |
        export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools:$PATH
        
        echo "========================================="
        echo "🔨 STARTING BUILD"
        echo "========================================="
        echo "ANDROID_HOME: $ANDROID_HOME"
        echo "PATH: $PATH"
        echo "========================================="
        
        # Проверяем sdkmanager в нужном месте
        if [[ -f "$ANDROID_HOME/tools/bin/sdkmanager" ]]; then
          echo "✅ sdkmanager found at tools/bin/"
        else
          echo "❌ sdkmanager NOT found at tools/bin/"
          exit 1
        fi
        
        # Проверяем platform-tools
        if [[ -d "$ANDROID_HOME/platform-tools" ]]; then
          echo "✅ platform-tools found"
        else
          echo "❌ platform-tools NOT found!"
          exit 1
        fi
        
        # Функция для сборки с повторными попытками
        build_with_retry() {
          local attempt=1
          local max_attempts=5
          
          while [ $attempt -le $max_attempts ]; do
            echo "🚀 Build attempt $attempt of $max_attempts..."
            
            # Пробуем собрать
            if buildozer android debug; then
              echo "✅ Build succeeded on attempt $attempt!"
              return 0
            fi
            
            echo "⚠️ Build attempt $attempt failed."
            
            # Проверяем, не ошибка ли это с сетью
            if grep -q "HTTP Error 502\|Bad Gateway\|connection timed out" build.log 2>/dev/null; then
              echo "🌐 Network error detected, waiting 30 seconds before retry..."
              sleep 30
            else
              echo "🔧 Non-network error, trying clean build..."
              buildozer android clean
            fi
            
            attempt=$((attempt + 1))
          done
          
          echo "❌ All $max_attempts build attempts failed!"
          return 1
        }
        
        # Запускаем сборку с повторными попытками
        build_with_retry
        
        echo "========================================="
        echo "✅ BUILD COMPLETED"
        echo "========================================="
        ls -la bin/ || echo "❌ No APK found!"

    - name: 📤 Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: anime-parser-apk
        path: bin/*.apk
        retention-days: 30

    - name: 📧 Notify build result
      if: always()
      run: |
        if [[ ${{ job.status }} == "success" ]]; then
          echo "✅ Build succeeded! APK uploaded to artifacts."
        else
          echo "❌ Build failed!"
          echo "🔧 Try running again: https://github.com/${{ github.repository }}/actions/workflows/build.yaml"
        fi
