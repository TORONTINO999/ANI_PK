name: 🤖 Auto-Healing Android Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build APK with Docker
      run: |
        docker run --rm \
          -v $PWD:/app \
          -v ~/.buildozer:/home/user/.buildozer \
          -v ~/.android:/home/user/.android \
          -w /app \
          kivy/buildozer:latest \
          bash -c "
            export ANDROID_HOME=/home/user/.android/sdk
            export ANDROID_SDK_ROOT=/home/user/.android/sdk
            export PATH=\$ANDROID_HOME/cmdline-tools/latest/bin:\$ANDROID_HOME/tools/bin:\$ANDROID_HOME/platform-tools:\$PATH
            buildozer android debug
          "

    - name: 📤 Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: anime-parser-apk
        path: bin/*.apk
        retention-days: 30

    - name: 📧 Notify build result
      if: always()
      run: |
        if [[ "${{ job.status }}" == "success" ]]; then
          echo "✅ Build succeeded! APK uploaded to artifacts."
        else
          echo "❌ Build failed!"
          echo "🔗 Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        fi
