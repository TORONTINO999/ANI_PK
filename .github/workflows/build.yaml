name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Setup Java 8
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '8'

    - name: Setup Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          git zip unzip autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev \
          cmake libffi-dev libssl-dev \
          automake libltdl-dev python3-dev
        sudo apt-get install -y -qq libtinfo6 || true

    - name: Install Python packages
      run: |
        python -m pip install --upgrade pip
        pip install buildozer

    - name: Clean old Android SDK and NDK
      run: |
        rm -rf ~/.buildozer/android/platform/android-sdk || true
        rm -rf ~/.buildozer/android/platform/android-ndk-* || true

    - name: Setup complete Android SDK
      run: |
        export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        mkdir -p $ANDROID_HOME
        cd $ANDROID_HOME
        
        # Скачиваем Command Line Tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip
        rm commandlinetools-linux-11076708_latest.zip
        
        # Создаем правильную структуру
        mkdir -p cmdline-tools/latest
        mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
        
        # Создаем структуру для совместимости с Buildozer
        mkdir -p tools/bin
        cp cmdline-tools/latest/bin/sdkmanager tools/bin/ || true
        cp -r cmdline-tools/latest/lib tools/ 2>/dev/null || true
        
        # Принимаем лицензии
        yes | tools/bin/sdkmanager --licenses || true
        yes | cmdline-tools/latest/bin/sdkmanager --licenses || true
        
        # Устанавливаем компоненты
        tools/bin/sdkmanager "platform-tools" || true
        tools/bin/sdkmanager "platforms;android-33" || true
        tools/bin/sdkmanager "build-tools;33.0.2" || true
        tools/bin/sdkmanager "build-tools;30.0.3" || true

    - name: Cache Buildozer
      uses: actions/cache@v3
      with:
        path: ~/.buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Build APK
      run: |
        export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        export PATH=$PATH:$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: anime-parser-apk
        path: bin/*.apk
        retention-days: 30

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: bin/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
