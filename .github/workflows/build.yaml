name: 🤖 Auto-Healing Android Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Setup Java 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          git zip unzip autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev \
          cmake libffi-dev libssl-dev \
          automake libltdl-dev python3-dev \
          libtinfo6

    - name: Install Python packages
      run: |
        python -m pip install --upgrade pip
        pip install buildozer

    # =====================================================
    # 1️⃣ ПРЕДВАРИТЕЛЬНАЯ ЗАГРУЗКА freetype
    # =====================================================
    - name: 📦 Pre-download freetype from GitHub mirror
      run: |
        mkdir -p ~/.buildozer/android/platform/build-arm64-v8a/packages/freetype
        cd ~/.buildozer/android/platform/build-arm64-v8a/packages/freetype
        
        echo "📥 Downloading freetype from GitHub mirror..."
        wget -q https://github.com/akheron/jansson/raw/master/CMake/FindFreetype.cmake -O freetype-2.14.1.tar.gz || \
        wget -q https://download.savannah.gnu.org/releases/freetype/freetype-2.14.1.tar.gz || \
        wget -q https://mirrors.kernel.org/gnu/freetype/freetype-2.14.1.tar.gz || \
        echo "⚠️ All mirrors failed, will retry during build"
        
        echo "📂 Files in freetype directory:"
        ls -la

    # =====================================================
    # 2️⃣ НАСТРОЙКА SDK
    # =====================================================
    - name: 🚀 Setup Android SDK
      uses: amyu/setup-android@v5
      with:
        sdk-version: 33
        build-tools-version: 33.0.2
        ndk-version: 25.2.9519653

    - name: Cache Buildozer
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    # =====================================================
    # 3️⃣ КОПИРУЕМ SDK
    # =====================================================
    - name: 🔧 Configure SDK for Buildozer
      run: |
        export AMYU_SDK=$HOME/.android/sdk
        export BUILD_OZER_SDK=$HOME/.buildozer/android/platform/android-sdk
        
        echo "🔄 Copying SDK from amyu to Buildozer location..."
        mkdir -p $BUILD_OZER_SDK
        cp -r $AMYU_SDK/* $BUILD_OZER_SDK/
        
        echo "✅ SDK copied to: $BUILD_OZER_SDK"
        
        # Создаем структуру, которую ожидает Buildozer
        echo "🔧 Creating legacy tools structure for Buildozer..."
        mkdir -p $BUILD_OZER_SDK/tools/bin
        
        # Создаем символические ссылки на sdkmanager и другие инструменты
        ln -sf $BUILD_OZER_SDK/cmdline-tools/latest/bin/sdkmanager $BUILD_OZER_SDK/tools/bin/sdkmanager
        ln -sf $BUILD_OZER_SDK/cmdline-tools/latest/bin/avdmanager $BUILD_OZER_SDK/tools/bin/avdmanager
        
        echo "✅ Legacy tools links created"
        
        # Проверяем platform-tools
        if [[ -d "$BUILD_OZER_SDK/platform-tools" ]]; then
          echo "✅ platform-tools found!"
        else
          echo "❌ platform-tools not found!"
          exit 1
        fi
        
        # Создаем файл с принятыми лицензиями
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        
        # Устанавливаем переменные окружения
        echo "ANDROID_HOME=$BUILD_OZER_SDK" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$BUILD_OZER_SDK" >> $GITHUB_ENV

    # =====================================================
    # 4️⃣ ПРИНИМАЕМ ЛИЦЕНЗИИ
    # =====================================================
    - name: Accept Android licenses
      run: |
        export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        echo "📝 Accepting Android SDK licenses..."
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        echo "✅ Licenses accepted"

    # =====================================================
    # 5️⃣ ДИАГНОСТИКА SDK
    # =====================================================
    - name: 🔍 SDK Diagnostics
      run: |
        export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        
        echo "========================================="
        echo "📱 SDK DIAGNOSTICS"
        echo "========================================="
        echo "ANDROID_HOME: $ANDROID_HOME"
        echo ""
        
        echo "📂 SDK Structure:"
        ls -la $ANDROID_HOME
        echo ""
        
        echo "🔍 Checking tools/bin:"
        ls -la $ANDROID_HOME/tools/bin/ 2>/dev/null || echo "  ❌ tools/bin not found!"
        echo ""
        
        echo "📦 Checking components:"
        for comp in "platform-tools" "build-tools/33.0.2" "platforms/android-33"; do
          if [[ -d "$ANDROID_HOME/$comp" ]]; then
            echo "  ✅ $comp"
          else
            echo "  ❌ $comp NOT found"
          fi
        done
        echo "========================================="

    # =====================================================
    # 6️⃣ СБОРКА APK
    # =====================================================
    - name: 🔨 Build APK
      run: |
        export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools:$PATH
        
        echo "========================================="
        echo "🔨 STARTING BUILD"
        echo "========================================="
        echo "ANDROID_HOME: $ANDROID_HOME"
        echo "PATH: $PATH"
        echo "========================================="
        
        # Проверяем sdkmanager в нужном месте
        if [[ -f "$ANDROID_HOME/tools/bin/sdkmanager" ]]; then
          echo "✅ sdkmanager found at tools/bin/"
        else
          echo "❌ sdkmanager NOT found at tools/bin/"
          exit 1
        fi
        
        # Проверяем platform-tools
        if [[ -d "$ANDROID_HOME/platform-tools" ]]; then
          echo "✅ platform-tools found"
        else
          echo "❌ platform-tools NOT found!"
          exit 1
        fi
        
        echo "🚀 Running buildozer..."
        buildozer android debug
        
        echo "========================================="
        echo "✅ BUILD COMPLETED"
        echo "========================================="
        ls -la bin/ || echo "❌ No APK found!"

    - name: 📤 Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: anime-parser-apk
        path: bin/*.apk
        retention-days: 30

    - name: 📧 Notify build result
      if: always()
      run: |
        if [[ ${{ job.status }} == "success" ]]; then
          echo "✅ Build succeeded! APK uploaded to artifacts."
        else
          echo "❌ Build failed!"
          echo "🔧 Try running again: https://github.com/${{ github.repository }}/actions/workflows/build.yaml"
        fi
