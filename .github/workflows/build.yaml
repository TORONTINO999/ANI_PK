name: 🤖 Auto-Healing Android Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Setup Java 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          git zip unzip autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev \
          cmake libffi-dev libssl-dev \
          automake libltdl-dev python3-dev \
          libtinfo6

    - name: Install Python packages
      run: |
        python -m pip install --upgrade pip
        pip install buildozer

    # =====================================================
    # 1️⃣ УСТАНАВЛИВАЕМ SDK ЧЕРЕЗ amyu/setup-android
    # =====================================================
    - name: 🚀 Setup Android SDK
      uses: amyu/setup-android@v5
      with:
        sdk-version: 33
        build-tools-version: 33.0.2
        ndk-version: 25.2.9519653

    # =====================================================
    # 2️⃣ КОПИРУЕМ SDK В ПАПКУ BUILD OZER
    # =====================================================
    - name: 🔧 Configure SDK for Buildozer
      run: |
        export AMYU_SDK=$HOME/.android/sdk
        export BUILD_OZER_SDK=$HOME/.buildozer/android/platform/android-sdk
        
        echo "🔄 Copying SDK from amyu to Buildozer location..."
        
        # СОЗДАЕМ ВСЕ НУЖНЫЕ ПАПКИ
        mkdir -p $BUILD_OZER_SDK
        
        # Копируем SDK (создаем папку назначения)
        cp -r $AMYU_SDK/* $BUILD_OZER_SDK/
        
        # Проверяем результат
        echo "✅ SDK copied to: $BUILD_OZER_SDK"
        ls -la $BUILD_OZER_SDK | head -20
        
        # Проверяем platform-tools
        if [[ -d "$BUILD_OZER_SDK/platform-tools" ]]; then
          echo "✅ platform-tools found!"
        else
          echo "❌ platform-tools not found!"
          exit 1
        fi
        
        # Создаем файл с принятыми лицензиями для Buildozer
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        
        # Устанавливаем переменные окружения
        echo "ANDROID_HOME=$BUILD_OZER_SDK" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$BUILD_OZER_SDK" >> $GITHUB_ENV

    # =====================================================
    # 3️⃣ ДИАГНОСТИКА SDK
    # =====================================================
    - name: 🔍 SDK Diagnostics
      run: |
        export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        
        echo "========================================="
        echo "📱 SDK DIAGNOSTICS"
        echo "========================================="
        echo "ANDROID_HOME: $ANDROID_HOME"
        echo ""
        
        echo "📂 SDK Structure:"
        ls -la $ANDROID_HOME | head -20
        echo ""
        
        echo "📦 Checking components:"
        for comp in "platform-tools" "build-tools/33.0.2" "platforms/android-33"; do
          if [[ -d "$ANDROID_HOME/$comp" ]]; then
            echo "  ✅ $comp"
          else
            echo "  ❌ $comp NOT found"
          fi
        done
        echo ""
        
        echo "🔍 sdkmanager location:"
        find $ANDROID_HOME -name "sdkmanager" 2>/dev/null | head -3
        echo "========================================="

    - name: Cache Buildozer
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    # =====================================================
    # 4️⃣ СБОРКА APK
    # =====================================================
    - name: 🔨 Build APK
      run: |
        export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        export PATH=$ANDROID_HOME/platform-tools:$PATH
        
        # Добавляем sdkmanager в PATH
        if [[ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]]; then
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
        elif [[ -d "$ANDROID_HOME/tools/bin" ]]; then
          export PATH=$ANDROID_HOME/tools/bin:$PATH
        fi
        
        echo "========================================="
        echo "🔨 STARTING BUILD"
        echo "========================================="
        echo "ANDROID_HOME: $ANDROID_HOME"
        echo "PATH: $PATH"
        echo "========================================="
        
        # Проверяем sdkmanager
        if command -v sdkmanager &> /dev/null; then
          echo "✅ sdkmanager: $(which sdkmanager)"
        else
          echo "❌ sdkmanager NOT in PATH!"
          exit 1
        fi
        
        # Проверяем platform-tools
        if [[ -d "$ANDROID_HOME/platform-tools" ]]; then
          echo "✅ platform-tools found"
        else
          echo "❌ platform-tools NOT found!"
          exit 1
        fi
        
        echo "🚀 Running buildozer..."
        buildozer android debug
        
        echo "========================================="
        echo "✅ BUILD COMPLETED"
        echo "========================================="
        ls -la bin/ || echo "❌ No APK found!"

    - name: 📤 Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: anime-parser-apk
        path: bin/*.apk
        retention-days: 30
