name: 🤖 Auto-Healing Android Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Setup Java 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
          git zip unzip autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev \
          cmake libffi-dev libssl-dev \
          automake libltdl-dev python3-dev \
          libtinfo6 ccache

    - name: Install Python packages
      run: |
        python -m pip install --upgrade pip
        pip install buildozer

    # =====================================================
    # 1️⃣ ПРЕДВАРИТЕЛЬНАЯ ЗАГРУЗКА — ПРАВИЛЬНАЯ ВЕРСИЯ
    # =====================================================
    - name: 📦 Pre-download recipes with correct Python version
      run: |
        BASE_DIR="$HOME/.buildozer/android/platform/build-arm64-v8a/packages"
        mkdir -p "$BASE_DIR"
        cd "$BASE_DIR"
        
        PYTHON_VERSION="3.11.12"
        
        # hostpython3
        mkdir -p hostpython3 && cd hostpython3
        wget -q --timeout=60 https://github.com/python/cpython/archive/refs/tags/v${PYTHON_VERSION}.tar.gz -O v${PYTHON_VERSION}.tar.gz
        tar -xzf v${PYTHON_VERSION}.tar.gz
        cd ..
        
        # python3
        mkdir -p python3 && cd python3
        cp ../hostpython3/v${PYTHON_VERSION}.tar.gz .
        tar -xzf v${PYTHON_VERSION}.tar.gz
        cd ..
        
        # freetype
        mkdir -p freetype && cd freetype
        wget -q --timeout=60 https://github.com/freetype/freetype/archive/refs/tags/VER-2-14-1.tar.gz -O freetype-2.14.1.tar.gz
        tar -xzf freetype-2.14.1.tar.gz
        cd ..
        
        # jpeg
        mkdir -p jpeg && cd jpeg
        wget -q --timeout=60 https://github.com/libjpeg-turbo/libjpeg-turbo/archive/2.0.1.tar.gz -O 2.0.1.tar.gz
        tar -xzf 2.0.1.tar.gz
        cd ..
        
        # libffi
        mkdir -p libffi && cd libffi
        wget -q --timeout=60 https://github.com/libffi/libffi/archive/v3.4.2.tar.gz -O v3.4.2.tar.gz
        tar -xzf v3.4.2.tar.gz
        cd ..
        
        # openssl
        mkdir -p openssl && cd openssl
        wget -q --timeout=60 https://www.openssl.org/source/openssl-3.3.1.tar.gz -O openssl-3.3.1.tar.gz
        tar -xzf openssl-3.3.1.tar.gz
        cd ..
        
        # png
        mkdir -p png && cd png
        wget -q --timeout=60 https://github.com/glennrp/libpng/archive/v1.6.37.zip -O v1.6.37.zip
        unzip -q v1.6.37.zip
        cd ..
        
        # sdl2_image
        mkdir -p sdl2_image && cd sdl2_image
        wget -q --timeout=60 https://github.com/libsdl-org/SDL_image/releases/download/release-2.8.2/SDL2_image-2.8.2.tar.gz -O SDL2_image-2.8.2.tar.gz
        tar -xzf SDL2_image-2.8.2.tar.gz
        cd ..
        
        # sdl2_mixer
        mkdir -p sdl2_mixer && cd sdl2_mixer
        wget -q --timeout=60 https://github.com/libsdl-org/SDL_mixer/releases/download/release-2.6.3/SDL2_mixer-2.6.3.tar.gz -O SDL2_mixer-2.6.3.tar.gz
        tar -xzf SDL2_mixer-2.6.3.tar.gz
        cd ..
        
        # sdl2_ttf
        mkdir -p sdl2_ttf && cd sdl2_ttf
        wget -q --timeout=60 https://github.com/libsdl-org/SDL_ttf/releases/download/release-2.22.0/SDL2_ttf-2.22.0.tar.gz -O SDL2_ttf-2.22.0.tar.gz
        tar -xzf SDL2_ttf-2.22.0.tar.gz
        cd ..
        
        # sqlite3
        mkdir -p sqlite3 && cd sqlite3
        wget -q --timeout=60 https://github.com/sqlite/sqlite/archive/refs/tags/version-3.50.4.tar.gz -O version-3.50.4.tar.gz
        tar -xzf version-3.50.4.tar.gz
        cd ..
        
        # sdl2
        mkdir -p sdl2 && cd sdl2
        wget -q --timeout=60 https://github.com/libsdl-org/SDL/releases/download/release-2.30.11/SDL2-2.30.11.tar.gz -O SDL2-2.30.11.tar.gz
        tar -xzf SDL2-2.30.11.tar.gz
        cd ..
        
        # pillow
        mkdir -p Pillow && cd Pillow
        wget -q --timeout=60 https://github.com/python-pillow/Pillow/archive/11.3.0.tar.gz -O 11.3.0.tar.gz
        tar -xzf 11.3.0.tar.gz
        cd ..
        
        # pyjnius
        mkdir -p pyjnius && cd pyjnius
        wget -q --timeout=60 https://github.com/kivy/pyjnius/archive/1.7.0.zip -O 1.7.0.zip
        unzip -q 1.7.0.zip
        cd ..
        
        # kivy
        mkdir -p kivy && cd kivy
        wget -q --timeout=60 https://github.com/kivy/kivy/archive/2.2.1.zip -O 2.2.1.zip
        unzip -q 2.2.1.zip
        cd ..
        
        echo "✅ All archives pre-downloaded with Python ${PYTHON_VERSION}"

    # =====================================================
    # 2️⃣ НАСТРОЙКА SDK (ИСПОЛЬЗУЕТ КЭШ)
    # =====================================================
    - name: 🚀 Setup Android SDK
      uses: amyu/setup-android@v5
      with:
        sdk-version: 33
        build-tools-version: 33.0.2
        ndk-version: 25.2.9519653
        command-line-tools-version: 14742923

    - name: Cache Buildozer
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}-
          ${{ runner.os }}-buildozer-

    - name: 🔧 Configure SDK for Buildozer
      run: |
        export AMYU_SDK=$HOME/.android/sdk
        export BUILD_OZER_SDK=$HOME/.buildozer/android/platform/android-sdk
        
        echo "🔄 Copying SDK..."
        mkdir -p $BUILD_OZER_SDK
        cp -r $AMYU_SDK/* $BUILD_OZER_SDK/
        
        echo "🔧 Creating legacy tools structure..."
        mkdir -p $BUILD_OZER_SDK/tools/bin
        ln -sf $BUILD_OZER_SDK/cmdline-tools/latest/bin/sdkmanager $BUILD_OZER_SDK/tools/bin/sdkmanager
        ln -sf $BUILD_OZER_SDK/cmdline-tools/latest/bin/avdmanager $BUILD_OZER_SDK/tools/bin/avdmanager
        
        if [[ -d "$BUILD_OZER_SDK/platform-tools" ]]; then
          echo "✅ platform-tools found!"
        else
          echo "❌ platform-tools not found!"
          exit 1
        fi
        
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        
        echo "ANDROID_HOME=$BUILD_OZER_SDK" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$BUILD_OZER_SDK" >> $GITHUB_ENV

    # =====================================================
    # 3️⃣ 🔗 ПРОВЕРКА И НАСТРОЙКА NDK (ИСПРАВЛЕНО)
    # =====================================================
    - name: 🔗 Verify and Link NDK for Buildozer
      run: |
        export BUILD_OZER_SDK=$HOME/.buildozer/android/platform/android-sdk
        export NDK_VERSION="25.2.9519653"
        
        echo "📂 Checking NDK location..."
        
        # Проверяем, существует ли NDK уже в папке Buildozer
        if [[ -d "$BUILD_OZER_SDK/ndk/$NDK_VERSION" ]]; then
          echo "✅ NDK already exists at $BUILD_OZER_SDK/ndk/$NDK_VERSION"
        else
          echo "📦 NDK not found, copying from $ANDROID_HOME/ndk/$NDK_VERSION..."
          mkdir -p $BUILD_OZER_SDK/ndk
          cp -r $ANDROID_HOME/ndk/$NDK_VERSION $BUILD_OZER_SDK/ndk/
        fi
        
        # Создаем ndk-bundle если его нет
        if [[ ! -L "$BUILD_OZER_SDK/ndk-bundle" ]] && [[ ! -d "$BUILD_OZER_SDK/ndk-bundle" ]]; then
          echo "🔗 Creating ndk-bundle symlink..."
          ln -sf $BUILD_OZER_SDK/ndk/$NDK_VERSION $BUILD_OZER_SDK/ndk-bundle
        else
          echo "✅ ndk-bundle already exists"
        fi
        
        echo "✅ NDK ready: $NDK_VERSION"
        echo "📁 Contents of $BUILD_OZER_SDK/ndk/:"
        ls -la $BUILD_OZER_SDK/ndk/ || echo "❌ NDK directory not found!"
        echo "📁 ndk-bundle symlink:"
        ls -la $BUILD_OZER_SDK/ndk-bundle || echo "❌ ndk-bundle not found!"

    - name: Accept Android licenses
      run: |
        export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: 🔨 Build APK
      run: |
        export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools:$PATH
        export TERM=dumb
        export PYTHONUNBUFFERED=1
        
        # Добавляем явную проверку NDK
        echo "🔍 Verifying NDK installation..."
        if [[ -d "$ANDROID_HOME/ndk/25.2.9519653" ]]; then
          echo "✅ NDK found at $ANDROID_HOME/ndk/25.2.9519653"
        else
          echo "❌ NDK not found!"
          ls -la $ANDROID_HOME/ndk/ || echo "No ndk directory"
          exit 1
        fi
        
        echo "========================================="
        echo "🔨 STARTING BUILD"
        echo "========================================="
        
        echo "🚀 Running buildozer..."
        buildozer android debug 2>&1 | tee build.log || {
          echo "❌ Build failed! Last 200 lines:"
          tail -n 200 build.log
          exit 1
        }
        
        echo "========================================="
        echo "✅ BUILD COMPLETED"
        echo "========================================="
        ls -la bin/ || echo "❌ No APK found!"

    - name: 📤 Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: anime-parser-apk
        path: bin/*.apk
        retention-days: 30

    - name: 📧 Notify build result
      if: always()
      run: |
        if [[ "${{ job.status }}" == "success" ]]; then
          echo "✅ Build succeeded! APK uploaded to artifacts."
        else
          echo "❌ Build failed!"
          echo "🔗 Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        fi
